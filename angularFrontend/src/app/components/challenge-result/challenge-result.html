<div class="challenge-result-card" [style.backgroundColor]="backgroundColor">
    <div class="challenge-result-grid">
        <div class="video-section">
            <app-embedded-vid [videoId]="videoId"></app-embedded-vid>
        </div>

        <div class="a">
            <img class="challenge-result-icon" [src]="iconSrc">
        </div>

        <div class="b">
            <div class="vertical-line"></div>
        </div>

        <div class="c">
            <img class="challenge-result-icon" [src]="iconSrc">
        </div>

        <div class="d">
            <div class="vertical-line"></div>
        </div>

        <div class="e">
            <h3>{{ challengeTitle }}</h3>
        </div>

        <div class="f">
            <p>
                {{ challengeContent }}
            </p>
        </div>

        <div class="g">
            <h3>{{ resultTitle }}</h3>
        </div>

        <div class="h">
            <h1>
                {{ resultContent }}
            </h1>
        </div>

        <div class="i">
            <p>
                {{ testimonial }}

                <br>
                <br>

                <span style="font-weight: bold;">- {{ customerName }}</span>
            </p>

        </div>
    </div>
</div>
