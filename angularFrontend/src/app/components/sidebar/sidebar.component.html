<aside class="sidebar">
  <div class="sidebar-content">
    <div class="sidebar-header">
      <h3>Navigation</h3>
    </div>


    <nav>
      <ul class="nav-links">
        @for (link of links(); track link.href) {
          <li>
            <a [href]="link.href">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
</aside>
