<div [attr.data-most-popular]="isMostPopular()">
  <div class="most-popular-label">
    Most popular
  </div>

  <div class="card-body">
    <span class="name">{{name()}}</span>
    <span class="price">${{price()}} / mo</span>


    <ul>
      @for (feature of features(); track $index) {
        <li><span>{{feature}}</span></li>
      }
    </ul>
  </div>

  <a class="cta" [href]="`join?plan=${name()?.toLowerCase()}`">
    {{cta()}}
  </a>
</div>
