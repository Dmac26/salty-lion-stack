<div class="track">
  @for (item of [].constructor(2); track $index) {
    <div class="entry-group">
      @for (entry of entries; track entry) {
        <div class="entry">
          <div class="front">
            <img [src]="getImgUrl(entry.name)">
            <h3>{{entry.name}}</h3>
          </div>

          <div class="back">
            <p>
              {{entry.quote}}
              <br />
              &mdash; {{entry.name}}
            </p>
          </div>

        </div>
      }
    </div>
  }
</div>
