<div class="track">
  @for (item of [].constructor(2); track $index) {
    <div class="entry-group">
      @for (entry of entries; track entry) {
        <div class="entry">
          <div class="front">
            <img [src]="getFrontImgUrl(entry.name)">
          </div>

          <div class="back">
            <img [src]="getBackImgUrl(entry.name)">
          </div>
        </div>
      }
    </div>
  }
</div>
